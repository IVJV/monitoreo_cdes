project:
  type: website
  execute-dir: project

  resources:
    - reporting/report_navigation.js
    - "!output/**"


# If Quarto is rendered without an explicit --profile,
# use the technical report configuration by default.
profile:
  default: technical


lang: es


website:
  # Common website behavior for technical and audit reports.
  search: false

  bread-crumbs: false
  page-navigation: false

  sidebar:
    style: docked

    # Unified white background; visual treatment is completed by reporting/styles/.
    background: "#ffffff"
    foreground: "#506675"

    border: true
    search: false
    collapse-level: 1


format:
  html:
    theme: default

    css:
      - reporting/styles/base.css
      - reporting/styles/navigation.css
      - reporting/styles/report_components.css
      - reporting/styles/tables.css

    # The website sidebar is the navigation layer.
    toc: false

    page-layout: full

    grid:
      sidebar-width: 270px
      body-width: 1150px
      margin-width: 0px
      gutter-width: 28px

    embed-resources: true
    smooth-scroll: true


execute:
  echo: false
  warning: false
  message: false
  error: false